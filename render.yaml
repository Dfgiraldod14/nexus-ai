services:
  - type: web
    name: paypal-nexus-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.17.1
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: BOT_URL
        value: http://150.136.227.127:8501
      - key: BOT_STRATEGY_PATH
        value: /nexus/strategy,/api/strategy,/strategy,/.well-known/nexus.json
      - key: SEED_DEMO
        value: "1"
      - key: QUOTE_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
